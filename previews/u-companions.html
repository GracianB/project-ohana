<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OHANA · Compañeros U en acción</title><style>*{box-sizing:border-box}body{margin:0;background:#111e2b;color:#fff3dd;font:16px system-ui}main{max-width:1100px;padding:24px;margin:auto}h1{font-size:38px;margin-bottom:8px}p{color:#b4cbd6}select,button{font:inherit;padding:10px;border:1px solid #668392;border-radius:12px;background:#243b4b;color:#fff;margin:5px}canvas{width:100%;background:#182a38;border-radius:24px}input[type=range]{width:100%}label{display:inline-flex;align-items:center;gap:6px;margin:8px}</style><main><h1>¡Déjame a mí!</h1><p>Tu compañero entra en acción. Puedes moverte mientras él termina su ataque y se despide.</p><label>Héroe <select id="hero"></select></label><label>Compañero <select id="ally"></select></label><label>Forma <select id="form"><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option><option value="4" selected>5</option></select></label><button id="pause">Pausar</button><button id="mirror">Girar</button><label><input id="move" type="checkbox" checked>El héroe se mueve</label><canvas id="stage" width="1000" height="440"></canvas><input id="time" type="range" min="0" max="119" value="0"><p id="beat"></p></main><script type="module">
import {ROSTER} from '../characters/roster.js';import {drawCharacter} from '../characters/draw.js';import {DEFAULT_U_PARTNERS} from '../systems/u-partners.js';import {startFamilyDuet,drawFamilyDuet} from '../systems/family-duets.js';import {guestPerformance} from '../systems/u-duet-direction-v315.js';
import {startMichiDuet,drawMichiDuet} from '../systems/michi-duet.js';import {startChispinDuet,drawChispinDuet} from '../systems/chispin-duet.js';import {startStitchoDuet,drawStitchoDuet} from '../systems/stitcho-duet.js';import {startKiloDuet,drawKiloDuet} from '../systems/kilo-duet.js';
const classic={cat:[startMichiDuet,drawMichiDuet,'_michiDuet'],chispin:[startChispinDuet,drawChispinDuet,'_chispinDuet'],stitcho:[startStitchoDuet,drawStitchoDuet,'_stitchoDuet'],kilo:[startKiloDuet,drawKiloDuet,'_kiloDuet']};
const hero=document.querySelector('#hero'),ally=document.querySelector('#ally'),form=document.querySelector('#form'),time=document.querySelector('#time'),canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d');hero.innerHTML=ROSTER.map(r=>'<option value="'+r.id+'">'+r.name+'</option>').join('');let runtime,entry,age=0,facing=1,paused=false,actors=[];
function choices(){ally.innerHTML=ROSTER.filter(r=>r.id!==hero.value).map(r=>'<option value="'+r.id+'">'+r.name+'</option>').join('');ally.value=DEFAULT_U_PARTNERS[hero.value];reset();}
function reset(){const def=ROSTER.find(r=>r.id===hero.value),evo=Number(form.value),f=def.forms[evo];runtime={player:{...def,...f,id:def.id,evo,x:450-f.w/2,y:340-f.h,w:f.w,h:f.h,facing,uSurprise:true,grounded:true,vx:0,vy:0,health:100,maxHealth:100},roomId:'hub',enemies:[]};entry=classic[def.id]&&ally.value===DEFAULT_U_PARTNERS[def.id]?classic[def.id]:[g=>startFamilyDuet(g,1,[],ally.value),drawFamilyDuet,'_familyDuet'];entry[0](runtime);age=0;paint();}
function paint(){actors=[];const p=runtime.player,s=runtime[entry[2]];s.age=age;p.x=450-p.w/2+(document.querySelector('#move').checked?facing*age*1.5:0);s.x=p.x+p.w/2;s.y=p.y+p.h;p.vx=document.querySelector('#move').checked?facing*2:0;p._poseOverride=p.vx?'run':'idle';ctx.clearRect(0,0,1000,440);ctx.fillStyle='#2e4653';ctx.fillRect(0,340,1000,100);ctx.strokeStyle='#8aac9a';ctx.beginPath();ctx.moveTo(25,341);ctx.lineTo(975,341);ctx.stroke();drawCharacter(ctx,p,{x:0,y:0},age*2+40);entry[1](ctx,s,{x:0,y:0},age*2+40,(...args)=>{actors.push(args[1]);drawCharacter(...args)},ROSTER,matchMedia('(prefers-reduced-motion:reduce)').matches);time.value=age;document.querySelector('#beat').textContent=age<18?'¡Llego!':age<36?'Vamos juntos':age<102?'¡Ahora me toca!':'¡Nos vemos!';}
hero.onchange=choices;ally.onchange=reset;form.onchange=reset;document.querySelector('#mirror').onclick=()=>{facing*=-1;reset()};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Animar':'Pausar'};time.oninput=()=>{paused=true;age=Number(time.value);paint()};choices();setInterval(()=>{if(!paused&&!document.hidden){age=(age+2)%120;paint()}},33);window.uCompanionPreview={setFrame(n){paused=true;age=n;paint();},actors(){return actors},state(){return runtime[entry[2]]}};window.previewReady=true;
</script></html>
