<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Michi · Nueve vidas de terciopelo</title><style>body{margin:0;background:#171425;color:#fff0f8;font:16px system-ui}main{max-width:1300px;margin:auto;padding:30px}h1{font-size:40px}p{color:#cab8d7}.forms{display:flex;flex-wrap:wrap;gap:12px}canvas{width:230px;height:280px;background:#292239;border-radius:24px}button,select{padding:12px;margin:10px;border:1px solid #907da6;border-radius:12px;background:#3b2e50;color:#fff}</style><main><h1>Nueve vidas de terciopelo.</h1><p>Patas pequeñas, colas que abrazan la luna y una mirada que sigue siendo Michi.</p><select id="pose"><option>idle</option><option>run</option><option>jump</option><option>attack</option><option>cast</option><option>hurt</option><option>dead</option><option>victory</option></select><button id="ending">Ver el final animado</button><div class="forms"></div></main><link rel="stylesheet" href="../ending.css"><script type="module">
import art from '../characters/art/cat.js';import {R} from '../characters/rig.js';import {showEnding} from '../systems/ending.js';
const canvases=Array.from({length:5},()=>{const c=document.createElement('canvas');c.width=460;c.height=560;document.querySelector('.forms').append(c);return c});let t=40;
function paint(){canvases.forEach((c,f)=>{const ctx=c.getContext('2d');ctx.clearRect(0,0,460,560);ctx.save();ctx.translate(255,485);ctx.scale(3.3,3.3);art.draw(ctx,{form:f,state:document.querySelector('#pose').value,t,phase:t*.15,look:{x:.2,y:0},atk:.5,cast:.5,castSlot:2,reduceMotion:false},R);ctx.restore()})}setInterval(()=>{t+=2;paint()},50);paint();document.querySelector('#ending').onclick=()=>showEnding({id:'cat',evo:4,hero:'Michi',form:'Eclipse',time:'2:25',kills:8});window.previewReady=true;
</script></html>
