<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OHANA · Galería de paisajes Canvas</title><link rel="stylesheet" href="../fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#102b3c;color:#f8e9c9;font:15px Outfit,system-ui,sans-serif}header{position:fixed;z-index:1;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border:1px solid #a5c1b455;border-radius:18px;background:#102b3ce8;box-shadow:0 8px 40px #071a2944}h1{font:600 18px Fredoka,system-ui,sans-serif;margin:0}label{display:flex;align-items:center;gap:7px}select,button{font:inherit;background:#f4dfac;color:#173746;border:0;border-radius:9px;padding:8px}input[type=range]{width:160px;accent-color:#f4dfac}canvas{display:block;width:100vw;height:100vh}footer{position:fixed;bottom:12px;left:14px;right:14px;max-width:640px;padding:12px 16px;border-radius:14px;background:#102b3ce8;line-height:1.45}small{color:#bcd3cb}@media(max-width:600px){header{gap:9px;padding:12px}h1{width:100%}input[type=range]{width:110px}footer{font-size:13px}}
</style></head><body><header><h1>OHANA · Paisajes vivos</h1><label>Sala <select id="hero"><option value="kilo">Kilo · Claro</option><option value="stitcho">Stitcho · Taller de mareas</option><option value="chispin">Chispín · Acueducto del trueno</option><option value="cat">Michi · Jardín lunar</option><option value="cuerno" selected>Cuerno · Bosque del prisma</option><option value="dragon">Dragón · Cordillera de brasas</option><option value="dino">Dino · Valle ancestral</option><option value="frita">Frita · Mercado del vapor</option><option value="pizza">Pizza · Terrazas del horno</option><option value="yomi">Yomi · Archivo celeste</option><option value="final">Corazón de Ohana</option></select></label><label>Cámara <input id="camera" type="range" min="0" max="14000" value="2400"></label><label><input id="pan" type="checkbox">Recorrer</label><label><input id="still" type="checkbox">Movimiento reducido</label></header><canvas id="scene" aria-label="Vista del paisaje seleccionado"></canvas><footer><span id="caption"></span><br><small>Vista del decorado: el terreno sólido, los personajes y los combates se dibujan aparte dentro del juego.</small></footer><script type="module">
import{drawLivingRealm}from'../worlds/living-realms.js';import{drawOhanaGarden}from'../worlds/ohana-garden.js';
const canvas=document.querySelector('#scene'),c=canvas.getContext('2d'),hero=document.querySelector('#hero'),camera=document.querySelector('#camera'),pan=document.querySelector('#pan'),still=document.querySelector('#still');
still.checked=matchMedia('(prefers-reduced-motion:reduce)').matches;
const descriptions={kilo:'El jardín existente de Kilo conserva su dibujo y sus palmeras.',stitcho:'Costa nocturna, cápsulas, grúas y talleres entre antenas luminosas.',chispin:'Acueductos sobre las nubes y colectores de tormenta.',cat:'Jardín lunar, setas y santuario de loto.',cuerno:'Árboles, prismas, cascadas y arcos de aurora.',dragon:'Puertas fósiles aladas y cordillera volcánica.',dino:'Helechos, costillas y un santuario de huevo.',frita:'Toldos, calderos y vapor en el mercado elevado.',pizza:'Pueblo en terrazas y hornos de leña sobre tierra visible.',yomi:'Bibliotecas y mecanismos del archivo celeste.',final:'Los diez emblemas de la familia en el gran observatorio.'};
let last=performance.now(),time=0;function frame(now){const dt=Math.min(50,now-last);last=now;if(!still.checked){time+=dt/16.667;if(pan.checked)camera.value=(Number(camera.value)+dt*.09)%14000;}const W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio,1.5);if(canvas.width!==Math.round(W*dpr)||canvas.height!==Math.round(H*dpr)){canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);}c.setTransform(dpr,0,0,dpr,0,0);const cam={x:Number(camera.value),y:0};if(hero.value==='kilo')drawOhanaGarden(c,cam,still.checked?0:time,W,H);else drawLivingRealm(c,hero.value,cam,W,H,time,{reduceMotion:still.checked});document.querySelector('#caption').textContent=descriptions[hero.value];requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
