</style></head><body><header><h1><small>EL DEVORADOR DE ECOS</small>Quimera</h1><select id="phase" aria-label="Fase"><option value="1">I · Cautiverio</option><option value="2">II · Despertar</option><option value="3">III · Desgarro</option><option value="4">IV · Último eco</option></select><select id="pose" aria-label="Acción"><option value="combat">Ataque completo</option><option value="rest">Reposo</option><option value="warn">Preparación</option><option value="attack">Ataque</option><option value="charge">Embestida</option><option value="leap">Salto sísmico</option><option value="hurt">Impacto</option><option value="dead">Derrota</option></select><select id="attack" aria-label="Poder preparado"></select><button id="mirror">Girar</button><button id="replay">Repetir</button><button id="prism">Probar prisma</button><button id="star">Probar estrella</button><button id="sound" aria-pressed="false">Sonido apagado</button><label><input type="checkbox" id="reduce"> Movimiento reducido</label></header>
<canvas aria-label="Quimera: preparación, ataque y recuperación"></canvas><footer><output id="beat">Preparación</output><span>Los ecos violetas atacan. Las estrellas doradas te ayudan.</span><a href="../?release=660">Volver al juego</a></footer><script>

if('serviceWorker' in navigator&&!['127.0.0.1','localhost'].includes(location.hostname)){

}
</script><script type="module">
import {drawQuimeraSanctum} from '../systems/quimera-regalia.js';

import {sfx,unlockAudioFromGesture} from '../engine/audio.js';

import {createFusionBoss,updateFusionBoss,drawFusionBoss,drawFusionAttackTelegraphs,FUSION_ATTACKS,FUSION_SPECIALS,fusionShotActive} from '../systems/fusion-boss.js';
import {WORLD1_ARENA as A,WORLD1_FLOOR as F} from '../systems/world1-rooms.js';
import {ATTACK_CARDS} from '../systems/world1-boss.js';
const attacks=document.querySelector('#attack'),phase=document.querySelector('#phase'),pose=document.querySelector('#pose'),reduceBox=document.querySelector('#reduce'),beat=document.querySelector('#beat');
for(const [id,def]of Object.entries(FUSION_ATTACKS)){const o=document.createElement('option');o.value=id;o.textContent=def.name;attacks.append(o);}
for(const [phase,def]of Object.entries(FUSION_SPECIALS)){const o=document.createElement('option');o.value='special-'+phase;o.textContent=def.name;attacks.append(o);}
const requestedAttack=new URLSearchParams(location.search).get('attack')||'rayos';if([...attacks.options].some(o=>o.value===requestedAttack))attacks.value=requestedAttack;
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let facing=-1,frame=0,last=0,elapsed=0,boss,g;const demoSecrets={};
let sound=false;const helpers={beep:n=>{if(sound)sfx(n);}};document.querySelector('#sound').onclick=()=>{unlockAudioFromGesture();sound=!sound;document.querySelector('#sound').setAttribute('aria-pressed',String(sound));document.querySelector('#sound').textContent=sound?'Sonido encendido':'Sonido apagado';};
const reduced=()=>reduceBox.checked||matchMedia('(prefers-reduced-motion: reduce)').matches;
function reset(){const special=Number(attacks.value.split('-')[1])||0;if(special)phase.value=String(special);boss=createFusionBoss(660);boss.x=A.left+1200;boss.phase=Number(phase.value);boss.hp=[0,2800,1800,1000,400][boss.phase];boss.facing=facing;if(special)boss.phase=special-1;const b=boss._fusion;b.mode='rest';b.rest=1;b.deck=[attacks.value];b.deckPhase=boss.phase;g={enemies:[boss],roomId:'w1-final',platforms:[],secrets:demoSecrets,boss,player:{x:boss.x+facing*390,y:F-48,w:32,h:48,health:100,maxHealth:120,grounded:true},reduceMotion:reduced()};updateFusionBoss(boss,g,helpers);elapsed=0;}
for(const element of[attacks,phase,pose])element.onchange=reset;document.querySelector('#replay').onclick=reset;document.querySelector('#star').onclick=()=>{const s=boss._fusion.pressure?.stars.find(s=>!g._quimeraStarPocket?.taken.has(s.id));if(s){g.player.x=s.x-16;g.player.y=s.y-24;collectQuimeraStars(g);}};document.querySelector('#prism').onclick=()=>{g.player.x=QUIMERA_ANCHORS[0].x-16;g.player.y=F-48;updateQuimeraArena(g);interactQuimeraArena(g);};document.querySelector('#mirror').onclick=()=>{facing*=-1;reset();};reset();
function paint(now){requestAnimationFrame(paint);if(now-last<16)return;const dt=Math.min(4,Math.max(1,Math.round((now-last)/16.667)));last=now;frame+=dt;
 const box=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(box.width*dpr)||canvas.height!==Math.round(box.height*dpr)){canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);const W=box.width,H=box.height,combat=pose.value==='combat',reduce=reduced();
 const bg=ctx.createRadialGradient(W*.52,H*.4,10,W*.5,H*.6,W*.65);bg.addColorStop(0,'#1a3447');bg.addColorStop(.55,'#101e33');bg.addColorStop(1,'#080f1e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 if(combat){
  g.reduceMotion=reduce;for(let i=0;i<dt;i++){if(boss._fusion.special?.id==='erupcion'){const q=boss._fusion.special.t,jump=q<80||q>204?0:q<100?(q-80)/20:q<=182?1:(204-q)/22;g.player.y=F-48-Math.max(0,jump)*120;g.player.grounded=jump<=0;}updateQuimeraArena(g);updateFusionBoss(boss,g,helpers);elapsed++;if(boss._fusion.mode==='rest'){if(attacks.value.startsWith('special-'))boss._fusion.rest=999;else{boss._fusion.deck=[attacks.value];boss._fusion.deckPhase=boss.phase;}}if(elapsed>(attacks.value.startsWith('special-')?(FUSION_SPECIALS[Number(phase.value)]?.length||420)+650:720))reset();}
  drawQuimeraSanctum(ctx,{x:W*.55,y:H*.37,width:W,height:H,phase:Number(phase.value),time:frame,reduce,boss,arena:g.quimeraArena,player:{x:W*.3,y:H*.8,w:20,h:40},cam:{x:0,y:0}});
  const scale=Math.min(W/(W<600?1200:1450),H/620),cam={x:boss.x+boss.w/2-150,y:0};
  ctx.save();ctx.translate(W*.57,H*.86);ctx.scale(scale,scale);ctx.translate(-150,-F);cam.x=boss.x+115-150;
  ctx.fillStyle='#22364a';ctx.fillRect(-1200,F,3000,13);ctx.fillStyle='#84b4b1';ctx.fillRect(-1200,F,3000,1);
  drawQuimeraArena(ctx,g,cam,frame,reduce);drawFusionAttackTelegraphs(ctx,boss,cam,frame,reduce);drawFusionBoss(ctx,boss,cam,frame,reduce);drawQuimeraStars(ctx,g,cam,frame,reduce);for(const m of boss._fusion.pressure?.minions||[])drawQuimeraMinion(ctx,m,cam,frame,reduce);
  // A simple scale marker denotes the locked target; no campaign state is used.
  const px=g.player.x-cam.x;ctx.fillStyle='#d9e7d3';ctx.globalAlpha=.6;ctx.beginPath();ctx.ellipse(px+16,F-24,13,23,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.restore();beat.textContent=(boss._fusion.mode==='warn'?'PREPARACIÓN · ':boss._fusion.mode==='rest'?'RECUPERACIÓN · ':'ATAQUE · ')+(ATTACK_CARDS[attacks.value]||FUSION_SPECIALS[Number(phase.value)]?.line||'Lee las señales del ataque');
 }else{
  const scale=Math.min(W/660,H/455);ctx.save();ctx.translate(W/2,H*.9);ctx.scale(scale,scale);
  const e={x:-115,y:-290,w:230,h:290,hp:pose.value==='dead'?0:100,phase:Number(phase.value),facing,flash:pose.value==='hurt'?8:0,_fusion:{mode:pose.value,clock:25,warnMax:78,attack:attacks.value}};drawQuimeraCreature(ctx,e,{x:0,y:0},frame,reduce);ctx.restore();beat.textContent=pose.selectedOptions[0].textContent;
 }
 canvas.dataset.activeKinds=combat?[...new Set(boss._fusion.shots.filter(fusionShotActive).map(s=>s.k))].join(','):'';
 document.querySelector('#star').disabled=!(boss._fusion.pressure?.stars.some(s=>s.life>0&&!g._quimeraStarPocket?.taken.has(s.id)));
 canvas.dataset.minionCount=String(boss._fusion.pressure?.minions.filter(m=>m.hp>0).length||0);canvas.dataset.starsTaken=String(g._quimeraStarPocket?.taken.size||0);
 window.previewReady=true;
}requestAnimationFrame(paint);
</script></body></html>
