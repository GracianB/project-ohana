<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quimera · estudio V600.1</title><style>body{height:100dvh;display:flex;flex-direction:column;margin:0;background:#10192a;color:#f5e3c5;font:16px system-ui}header{padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}h1{font-size:20px;margin:0}select,button{font:inherit;padding:8px;background:#243a50;color:#fff;border:1px solid #9bb6b8;border-radius:8px}canvas{display:block;width:100%;height:0;flex:1;min-height:380px}p{margin:0 16px;font-size:13px}</style><header><h1>Quimera · anatomía y metamorfosis</h1><select id="phase" aria-label="Fase"><option value="1">I · Coraza</option><option value="2">II · Corazón expuesto</option><option value="3">III · Corona ramificada</option><option value="4">IV · Membrana interior</option></select><select id="pose" aria-label="Acción"><option value="rest">Reposo</option><option value="warn">Preparación</option><option value="attack">Ataque</option><option value="hurt">Impacto</option><option value="dead">Derrota</option></select><button id="mirror">Girar</button><label><input type="checkbox" id="reduce"> Movimiento reducido</label></header><p>Renderer real del juego. Sin partículas ni HUD: silueta, materiales, anatomía y expresión.</p><canvas aria-label="Estudio animado de Quimera"></canvas><script type="module">
import{drawQuimeraCreature}from '../systems/quimera-art.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let facing=-1,frame=0,last=0;document.querySelector('#mirror').onclick=()=>{facing*=-1;};
function paint(now){requestAnimationFrame(paint);if(now-last<32)return;last=now;const box=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(box.width*dpr)||canvas.height!==Math.round(box.height*dpr)){canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);const W=box.width,H=box.height;ctx.fillStyle='#e8ecd9';ctx.fillRect(0,0,W,H);const scale=Math.min(W/690,H/510),pose=document.querySelector('#pose').value;ctx.save();ctx.translate(W/2,H*.92);ctx.scale(scale,scale);drawQuimeraCreature(ctx,{x:-115,y:-290,w:230,h:290,hp:pose==='dead'?0:100,phase:Number(document.querySelector('#phase').value),facing,flash:pose==='hurt'?8:0,_fusion:{mode:pose,clock:40}},{x:0,y:0},frame++,document.querySelector('#reduce').checked||matchMedia('(prefers-reduced-motion: reduce)').matches);ctx.restore();window.previewReady=true;}requestAnimationFrame(paint);
</script></html>
