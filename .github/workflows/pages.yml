name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run regression suites
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test
          node tests/browser/e2e.mjs

      - name: Release gate
        run: node tools/release-gate.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed GitHub Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "$PAGE_URL" -o /tmp/ohana.html
          grep -q "PROJECT OHANA" /tmp/ohana.html
          grep -q "ohana-" /tmp/ohana.html
          echo "[OHANA] GitHub Pages deployment verified: $PAGE_URL"

      - name: Production browser smoke
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node tests/browser/production-smoke.mjs
