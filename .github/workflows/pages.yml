name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRs are tested with the full Chromium, visual and release suite in
  # quality.yml. Deploying the *same merged code* must not re-run hundreds of
  # screenshots: the duplicate run used to time out and prevent publication.
  # Revalidate committed code, offline SHA manifest and critical invariants.
  verify-release:
    name: Release · unit tests and offline integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit and progression tests
        run: npm test
      - name: Validate release assets and content-addressed offline cache
        run: npm run release:check

  deploy:
    needs: verify-release
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Archive Pages artifact
        shell: sh
        run: |
          tar \
            --dereference --hard-dereference \
            --directory "." \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      # Give each attempt its own artifact. GitHub keeps artifacts from
      # previous attempts, so re-running a failed deploy otherwise creates
      # multiple "github-pages" archives and deploy-pages refuses to choose.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      # The Actions artifact service can be briefly eventually consistent:
      # an upload may report SUCCESS before deploy-pages can index it.
      - name: Allow artifact indexing
        shell: sh
        run: sleep 15

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
