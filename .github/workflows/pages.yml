name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run regression suites
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node --test tests/core.test.js tests/runtime.test.js tests/renderers.test.js tests/completeness.test.js tests/hardening.test.js tests/animation.test.js
          node tests/browser/e2e.mjs

      - name: Validate project consistency
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { ROSTER } from "./characters/roster.js";
          import { ROOMS } from "./systems/map.js";

          const read = (file) => fs.readFileSync(file, "utf8");
          const activeCharacters = ROSTER.length;
          const formsPerCharacter = ROSTER.length ? Math.min(...ROSTER.map((character) => character.forms.length)) : 0;
          const roomCount = Object.keys(ROOMS).length;
          const manifest = JSON.parse(read("manifest.json"));
          const index = read("index.html");
          const progress = read("PROGRESS.md");
          const improvements = read("IMPROVEMENTS.md");
          const readme = read("README.md");
          const errors = [];

          if (activeCharacters !== 10) {
            errors.push(`código: se esperaban 10 personajes activos, hay ${activeCharacters}`);
          }

          if (formsPerCharacter !== 5 || ROSTER.some((character) => character.forms.length !== 5)) {
            errors.push("código: no todos los personajes tienen exactamente 5 formas");
          }

          if (roomCount !== 10) {
            errors.push(`código: se esperaban 10 salas, hay ${roomCount}`);
          }

          const masterPatterns = [
            [new RegExp(activeCharacters + "\\s+personajes", "i"), "10 personajes"],
            [new RegExp(formsPerCharacter + "\\s+formas", "i"), "5 formas"],
            [new RegExp(roomCount + "\\s+salas", "i"), "10 salas"],
          ];

          for (const [pattern, label] of masterPatterns) {
            for (const [file, content] of [
              ["manifest.json", manifest.description || ""],
              ["README.md", readme],
              ["PROGRESS.md", progress],
              ["IMPROVEMENTS.md", improvements],
            ]) {
              if (!pattern.test(content)) {
                errors.push(`${file}: falta la cifra maestra ${label}`);
              }
            }
          }

          const versions = [...index.matchAll(/ohana-(\d+)/g)].map((m) => m[0]);
          const uniqueVersions = [...new Set(versions)];

          if (uniqueVersions.length !== 1) {
            errors.push("index.html: hay varias versiones ohana-*");
          }

          const currentVersion = uniqueVersions[0] || "";

          if (currentVersion && !progress.includes(currentVersion)) {
            errors.push(`PROGRESS.md: no refleja la caché ${currentVersion}`);
          }

          if (!progress.includes("node --test tests/core.test.js tests/runtime.test.js tests/renderers.test.js tests/completeness.test.js")) {
            errors.push("PROGRESS.md: no documenta las cuatro suites del CI");
          }

          if (!progress.includes("node tests/browser/e2e.mjs")) {
            errors.push("PROGRESS.md: no documenta el E2E real del navegador");
          }

          if (errors.length) {
            console.error("[OHANA] Consistency check FAILED");
            for (const error of errors) console.error(" - " + error);
            process.exit(1);
          }

          console.log("[OHANA] Consistency check PASS");
          console.log(" - " + (manifest.description || "sin descripción"));
          console.log(" - cache: " + (currentVersion || "sin versión"));
          console.log(" - CI: core + runtime + renderer + completeness + browser E2E");
          console.log(` - código: ${activeCharacters} personajes / ${formsPerCharacter} formas / ${roomCount} salas`);
          console.log(" - docs: código ↔ manifest ↔ README ↔ PROGRESS ↔ IMPROVEMENTS");
          NODE

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed GitHub Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "$PAGE_URL" -o /tmp/ohana.html
          grep -q "PROJECT OHANA" /tmp/ohana.html
          grep -q "ohana-" /tmp/ohana.html
          echo "[OHANA] GitHub Pages deployment verified: $PAGE_URL"
