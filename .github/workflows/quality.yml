name: quality

on:
  workflow_call:
  pull_request:
    # Stacked character PRs also need Browser/Visual/Release gates.
    branches: [main, 'feat/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit + Browser + Visual + Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Unit tests
        run: npm test

      - name: V420 readable welcome · pause, dialogue and replay
        run: node tests/browser/v420-welcome-story.mjs

      - name: V410 family camp · ten heroes and fifty real forms
        run: node tests/browser/v410-family-camp.mjs

      - name: V440 Michi animation and island traversal
        run: |
          node tests/browser/v440-michi.mjs
          node tests/browser/v441-grove.mjs
          node tests/browser/v442-albums.mjs
          node tests/browser/v443-kilo-flight.mjs
          node tests/browser/v444-kilo-combat.mjs
          node tests/browser/v1-candidate.mjs

      - name: V400 pause, audio and motion preferences
        run: node tests/browser/v400-experience.mjs

      - name: Local gameplay, offline fonts and responsive controls
        run: npm run test:browser:local

      - name: Illustrated atlas, readable guide and compact play interface
        run: npm run test:browser:presentation

      - name: Story bubbles, character sizes and surprise encore
        run: npm run test:browser:polish && npm run test:browser:characters && npm run test:browser:direction && npm run test:browser:chispa && npm run test:browser:approved-chispa && npm run test:browser:chispa-sanctuary

      - name: Browser E2E
        run: npm run test:browser

      - name: V366 performance · live desktop and mobile Chromium
        run: node tests/browser/v366-performance.mjs

      - name: V367 startup · lazy cinema and original scene routes
        run: node tests/browser/v367-startup.mjs

      - name: V369 actual Chromium cache upgrade · 199 reused and 1 transferred
        run: node tests/browser/v369-cache-migration.mjs

      - name: Cuerno V373 real runtime integration
        run: node tests/browser/cuerno-v373.mjs

      - name: Ten hero U protection audit
        run: node tests/browser/all-hero-u-protection.mjs

      - name: Michi personality and movement audit
        run: node tests/browser/michi-personality.mjs

      - name: Chispin personality and movement audit
        run: node tests/browser/chispin-personality.mjs

      - name: Stitcho personality and movement audit
        run: node tests/browser/stitcho-personality.mjs

      - name: Kilo personality and movement audit
        run: node tests/browser/kilo-personality.mjs

      - name: Kilo V301 vector and duet audit
        run: node tests/browser/kilo-v301.mjs

      - name: Stitcho V302 vector and storm audit
        run: node tests/browser/stitcho-v302.mjs

      - name: Michi V304 vector and duet audit
        run: node tests/browser/michi-v304.mjs

      - name: U · Ten deterministic partner cast audits
        run: node tests/browser/u-partners-v313.mjs

      - name: V314 · Pair-specific bond EXP, artwork and three resonance ranks
        run: node tests/browser/u-bonds-v314.mjs

      - name: V315 · Ten companion acting styles and 1,350 true duets
        run: node tests/browser/u-duet-direction-v315.mjs

      - name: Ten kinetic personalities (300 real Canvas scenes)
        run: node tests/browser/kinetic-v312.mjs

      - name: Six Family U duet screenshots (150 scenes)
        run: node tests/browser/family-duets-v306-v310.mjs

      - name: Michi Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: cat

      - name: Michi Firefox Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: cat
          OHANA_TEST_BROWSER: firefox

      - name: Chispin V303 vector and duet audit
        run: node tests/browser/chispin-v303.mjs

      - name: Chispin Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: chispin

      - name: Chispin Firefox Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: chispin
          OHANA_TEST_BROWSER: firefox

      - name: Multiplayer E2E
        run: npm run test:browser:multiplayer

      - name: Multiplayer with late ICE candidates
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_LATE_ICE: '1'

      - name: Firefox Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_BROWSER: firefox

      - name: Stitcho Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: stitcho

      - name: Stitcho Firefox Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: stitcho
          OHANA_TEST_BROWSER: firefox

      - name: Visual regression matrix
        run: npm run test:visual

      - name: Character Canvas proportions and Cuerno design
        run: npm run test:browser:characters

      - name: Cuerno finale attacks and evolutions
        run: npm run test:browser:cuerno

      - name: Michi redesign and living finale
        run: npm run test:browser:michi-ending

      - name: Surprise U companions in action
        run: npm run test:browser:u-companions

      - name: Release gate
        run: npm run release:check

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohana-visual-results
          path: test-results/
          if-no-files-found: ignore

  six-hero-coop:
    name: Six hero guest impacts and U echoes (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install selected browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Six real heroes as host and guest
        run: node tests/browser/six-hero-multiplayer.mjs
        env:
          OHANA_TEST_BROWSER: ${{ matrix.browser }}
