name: quality

on:
  pull_request:
    # Stacked character PRs also need Browser/Visual/Release gates.
    branches: [main, 'feat/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit + Browser + Visual + Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Browser E2E
        run: npm run test:browser

      - name: Multiplayer E2E
        run: npm run test:browser:multiplayer

      - name: Visual regression matrix
        run: npm run test:visual

      - name: Release gate
        run: npm run release:check

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohana-visual-results
          path: test-results/
          if-no-files-found: ignore
