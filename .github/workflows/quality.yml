name: quality

on:
  workflow_call:
    inputs:
      run_multiplayer:
        description: 'Ejecutar pruebas cooperativas locales solo bajo solicitud; sin servicios de pago'
        type: boolean
        required: false
        default: false
  pull_request:
    # Stacked character PRs also need Browser/Visual/Release gates.
    branches: [main, 'feat/**', 'fix/**']
  workflow_dispatch:
    inputs:
      run_multiplayer:
        description: 'Pruebas WebRTC locales (no Netlify / TURN / servidor externo)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit + Browser + Visual + Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Run fast checks first: bad JavaScript must not wait for apt mirrors.
      - name: Unit tests
        run: npm test

      # All normal browser/visual cases use Chromium. Firefox is only needed
      # for explicitly requested multiplayer runs, not every PR or Pages build.
      - name: Install browser dependencies
        run: |
          if [ "${{ inputs.run_multiplayer }}" = "true" ]; then
            npx playwright install --with-deps chromium firefox
          else
            # Hosted Ubuntu runners already ship with most Chromium libraries.
            # Avoid fetching dozens of Ubuntu packages from a slow apt mirror
            # on every PR; install OS deps only if an actual launch fails.
            npx playwright install chromium
            if ! node --input-type=module -e 'import {chromium} from "playwright"; const b=await chromium.launch(); await b.close()'; then
              npx playwright install-deps chromium
              node --input-type=module -e 'import {chromium} from "playwright"; const b=await chromium.launch(); await b.close()'
            fi
          fi

      - name: V500 constellation UI and persistence
        run: node tests/browser/v500-constellation.mjs

      # Check the chapter selector before the slow campaign and art matrix.
      - name: V410 family camp · ten heroes and fifty real forms
        run: node tests/browser/v410-family-camp.mjs

      # Catch presentation/selector regressions before the long campaign gates.
      - name: Story bubbles, character sizes and surprise encore
        run: npm run test:browser:polish && npm run test:browser:characters && npm run test:browser:direction && npm run test:browser:chispa && npm run test:browser:approved-chispa && npm run test:browser:chispa-sanctuary

      - name: V457 early optical size regression
        run: node tests/browser/character-size.mjs

      - name: V458 Michicornio art, custom foes, room and mobile
        run: node tests/browser/v458-michicornio.mjs

      - name: V473 five feline moon-jellies · idle, wake, unique palette and reduced motion
        run: node tests/browser/v473-lunar-jellies.mjs

      - name: V475 World 1 authentic keyboard start and Kilo first flower
        run: node tests/browser/v475-world1-natural-walk.mjs

      - name: V476 physical death retry · earned Kilo note without score farming
        run: node tests/browser/v476-death-checkpoint.mjs

      - name: V459 ten kinetic animations per hero, lunar feline lineage and accessibility
        run: node tests/browser/v459-motion.mjs

      - name: V460 Michicornio facial acting, ten kinetic states and metamorphosis cinema
        run: node tests/browser/v460-michicornio-cinema.mjs

      - name: V420 readable welcome · pause, dialogue and replay
        run: node tests/browser/v420-welcome-story.mjs

      - name: V440 Michi animation and island traversal
        run: |
          node tests/browser/v440-michi.mjs
          node tests/browser/v441-grove.mjs
          node tests/browser/v442-albums.mjs
          node tests/browser/v443-kilo-flight.mjs
          node tests/browser/v444-kilo-combat.mjs
          node tests/browser/v445-kilo-final.mjs
          node tests/browser/v452-kilo-phase-one.mjs
          node tests/browser/v453-hero-worlds.mjs
          node tests/browser/v1-candidate.mjs

      - name: V511 ten authored room scenes and real terrain traversal
        run: npm run test:browser:ten-room-direction && npm run test:browser:room-terrain

      - name: V510 Frita and Yomi physical chapters and mobile input
        run: npm run test:browser:frita-yomi-chapters

      - name: V510 Frita and Yomi presentation
        run: npm run test:browser:frita-yomi-presentation

      - name: V509 Pizza deliveries, Chef and mobile input
        run: npm run test:browser:pizza-chapter

      - name: V509 Pizza and Dino presentation
        run: npm run test:browser:pizza-dino-presentation

      - name: V508 Dino physical chapter and mobile dive
        run: npm run test:browser:dino-chapter

      - name: V508 Dino arrival and daylight valley
        run: npm run test:browser:dino-presentation

      - name: V507 Michi, Cuerno and Dragon physical chapters
        run: npm run test:browser:lunar-prism-embers

      - name: V507 three realm arrivals, landscapes and mobile controls
        run: npm run test:browser:three-realms

      - name: V457 solo chapter state, reward contracts, and mobile final forms
        run: node tests/browser/v457-ten-heroes.mjs

      - name: V400 pause, audio and motion preferences
        run: node tests/browser/v400-experience.mjs

      - name: Local gameplay, offline fonts and responsive controls
        run: npm run test:browser:local

      - name: Illustrated atlas, readable guide and compact play interface
        run: npm run test:browser:presentation

      - name: Browser E2E
        run: npm run test:browser

      - name: V366 performance · live desktop and mobile Chromium
        run: node tests/browser/v366-performance.mjs

      - name: V367 startup · lazy cinema and original scene routes
        run: node tests/browser/v367-startup.mjs

      - name: V369 actual Chromium cache upgrade · 199 reused and 1 transferred
        run: node tests/browser/v369-cache-migration.mjs

      - name: Cuerno V373 real runtime integration
        run: node tests/browser/cuerno-v373.mjs

      - name: Ten hero U protection audit
        run: node tests/browser/all-hero-u-protection.mjs

      - name: Michi personality and movement audit
        run: node tests/browser/michi-personality.mjs

      - name: Chispin personality and movement audit
        run: node tests/browser/chispin-personality.mjs

      - name: Stitcho personality and movement audit
        run: node tests/browser/stitcho-personality.mjs

      - name: Kilo personality and movement audit
        run: node tests/browser/kilo-personality.mjs

      - name: Kilo V301 vector and duet audit
        run: node tests/browser/kilo-v301.mjs

      - name: Stitcho V302 vector and storm audit
        run: node tests/browser/stitcho-v302.mjs

      - name: Michi V304 vector and duet audit
        run: node tests/browser/michi-v304.mjs

      - name: U · Ten deterministic partner cast audits
        run: node tests/browser/u-partners-v313.mjs

      - name: V314 · Pair-specific bond EXP, artwork and three resonance ranks
        run: node tests/browser/u-bonds-v314.mjs

      - name: V315 · Ten companion acting styles and 1,350 true duets
        run: node tests/browser/u-duet-direction-v315.mjs

      - name: Ten kinetic personalities (300 real Canvas scenes)
        run: node tests/browser/kinetic-v312.mjs

      - name: Six Family U duet screenshots (150 scenes)
        run: node tests/browser/family-duets-v306-v310.mjs

      - name: Michi Multiplayer E2E
        if: ${{ inputs.run_multiplayer == true }}
        run: npm run test:browser:multiplayer || npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: cat

      - name: Michi Firefox Multiplayer E2E
        if: ${{ inputs.run_multiplayer == true }}
        run: npm run test:browser:multiplayer || npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: cat
          OHANA_TEST_BROWSER: firefox

      - name: Chispin V303 vector and duet audit
        run: node tests/browser/chispin-v303.mjs

      - name: Chispin Multiplayer E2E
        if: ${{ inputs.run_multiplayer == true }}
        run: npm run test:browser:multiplayer || npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: chispin

      - name: Chispin Firefox Multiplayer E2E
        if: ${{ inputs.run_multiplayer == true }}
        run: npm run test:browser:multiplayer || npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: chispin
          OHANA_TEST_BROWSER: firefox

      - name: Multiplayer E2E
        if: ${{ inputs.run_multiplayer == true }}
        run: npm run test:browser:multiplayer || npm run test:browser:multiplayer

      - name: Multiplayer with late ICE candidates
        if: ${{ inputs.run_multiplayer == true }}
        run: npm run test:browser:multiplayer || npm run test:browser:multiplayer
        env:
          OHANA_TEST_LATE_ICE: '1'

      - name: Firefox Multiplayer E2E
        if: ${{ inputs.run_multiplayer == true }}
        run: npm run test:browser:multiplayer || npm run test:browser:multiplayer
        env:
          OHANA_TEST_BROWSER: firefox

      - name: Stitcho Multiplayer E2E
        if: ${{ inputs.run_multiplayer == true }}
        run: npm run test:browser:multiplayer || npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: stitcho

      - name: Stitcho Firefox Multiplayer E2E
        if: ${{ inputs.run_multiplayer == true }}
        run: npm run test:browser:multiplayer || npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: stitcho
          OHANA_TEST_BROWSER: firefox

      - name: Visual regression matrix
        run: npm run test:visual

      - name: Character Canvas proportions and Cuerno design
        run: npm run test:browser:characters

      - name: Cuerno finale attacks and evolutions
        run: npm run test:browser:cuerno

      - name: Michi redesign and living finale
        run: npm run test:browser:michi-ending

      - name: Surprise U companions in action
        run: npm run test:browser:u-companions

      # V477–V494 were incremental Easy-mode pilots for unfinished chapters.
      # Their assumptions (instant Kilo seal, timed Chispin chain, flat
      # terrain) are no longer true. They remain in tests/browser/ for
      # historical reproduction; do NOT claim that they pass as written.
      # The accepted gate is now strictly broader: one clean Normal save,
      # real terrain/jump/attack/respawn, all ten earned chapter bosses,
      # all 50 forms, every Quimera phase and the actual final screen.
      - name: V514 continuous Normal campaign · ten earned seals + Quimera HUD
        run: |
          CHROMIUM_BIN="$(node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')"
          export CHROMIUM_BIN
          node tests/browser/v513-full-campaign.mjs

      # Full continuous Normal play runs after fast regressions; it is also
      # checked independently by the V514 workflow on every PR.
      - name: Release gate
        run: npm run release:check

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohana-visual-results
          path: test-results/
          if-no-files-found: ignore

  six-hero-coop:
    if: ${{ inputs.run_multiplayer == true }}
    name: Six hero guest impacts and U echoes (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install selected browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Six real heroes as host and guest
        run: node tests/browser/six-hero-multiplayer.mjs
        env:
          OHANA_TEST_BROWSER: ${{ matrix.browser }}
