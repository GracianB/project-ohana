name: quality

on:
  pull_request:
    # Stacked character PRs also need Browser/Visual/Release gates.
    branches: [main, 'feat/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit + Browser + Visual + Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Unit tests
        run: npm test

      - name: Browser E2E
        run: npm run test:browser

      - name: Kilo personality and movement audit
        run: node tests/browser/kilo-personality.mjs

      - name: Kilo V301 vector and duet audit
        run: node tests/browser/kilo-v301.mjs

      - name: Stitcho V302 vector and storm audit
        run: node tests/browser/stitcho-v302.mjs

      - name: Michi V304 vector and duet audit
        run: node tests/browser/michi-v304.mjs

      - name: Ten kinetic personalities (300 real Canvas scenes)
        run: node tests/browser/kinetic-v312.mjs

      - name: Six Family U duet screenshots (150 scenes)
        run: node tests/browser/family-duets-v306-v310.mjs

      - name: Michi Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: cat

      - name: Michi Firefox Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: cat
          OHANA_TEST_BROWSER: firefox

      - name: Chispin V303 vector and duet audit
        run: node tests/browser/chispin-v303.mjs

      - name: Chispin Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: chispin

      - name: Chispin Firefox Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: chispin
          OHANA_TEST_BROWSER: firefox

      - name: Multiplayer E2E
        run: npm run test:browser:multiplayer

      - name: Multiplayer with late ICE candidates
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_LATE_ICE: '1'

      - name: Firefox Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_BROWSER: firefox

      - name: Stitcho Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: stitcho

      - name: Stitcho Firefox Multiplayer E2E
        run: npm run test:browser:multiplayer
        env:
          OHANA_TEST_HOST: stitcho
          OHANA_TEST_BROWSER: firefox

      - name: Visual regression matrix
        run: npm run test:visual

      - name: Release gate
        run: npm run release:check

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohana-visual-results
          path: test-results/
          if-no-files-found: ignore
