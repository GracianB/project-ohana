name: V637 Medusaluna Save and Pits

on:
  push:
    branches:
      - fix/medusaluna-resume-select-ocean-forms-20261105
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v637-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencies
        run: npm ci --no-audit --no-fund
      - name: Ownership, save and marine forms
        run: node --test tests/medusaluna-form-ownership.test.js tests/medusaluna-forms.test.js
      - name: Chromium
        run: npx playwright install chromium
      - name: Resume with unlocked form through real camp and HUD
        run: node tests/browser/medusaluna-resume.mjs
        env:
          CHROMIUM_BIN: ''
      - name: Real death in authored pits across seven chapters
        run: node tests/browser/pit-death-v637.mjs
        env:
          CHROMIUM_BIN: ''
      - name: Visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medusaluna-v637-camp-gallery
          path: test-results/medusaluna/
          if-no-files-found: ignore
