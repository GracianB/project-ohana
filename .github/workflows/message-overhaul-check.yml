name: message-overhaul-check

on:
  push:
    branches:
      - chore/message-overhaul-phase1

permissions:
  contents: read

jobs:
  test:
    name: Message contract and full unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test tests/*.js
