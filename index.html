<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROJECT OHANA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud">
    <div class="hud-block">
      <div class="hud-name" id="hud-name">Lilo</div>
      <div class="bar"><i id="hp-bar"></i></div>
      <div class="hud-meta" id="hud-meta">HP 100 · Lv 1</div>
    </div>
    <div class="hud-block right">
      <div id="hud-world">Isla Kauai</div>
      <div id="hud-evo">Forma: Base</div>
    </div>
  </div>

  <div id="ability-bar"></div>

  <canvas id="game" width="1280" height="720"></canvas>

  <div id="char-select">
    <h1>PROJECT OHANA</h1>
    <p>Elige personaje · WASD / flechas · J K L habilidades · 1-5 mundos · E evolucionar · R reaparecer</p>
    <div id="chars"></div>
  </div>

  <div id="notification-container"></div>

  <script type="module" src="game.js"></script>
</body>
</html>
